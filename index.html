<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Essense of Northeast</title>
    <style>
        /* ============================================
           iOS-inspired design system
           - SF Pro style stack, translucent materials,
             continuous corners, spring-timed transitions
           ============================================ */
        :root {
            --ios-blur: 30px;
            --ios-radius-lg: 28px;
            --ios-radius-md: 20px;
            --ios-radius-sm: 14px;
            --ios-green: #30d158;
            --ios-white: #ffffff;
            --ios-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ios-ease: cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display',
                'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #0a0a0a;
        }

        /* Full Screen Background Image */
        .background {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('bg-desktop.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-color: #121212;
            z-index: 1;
        }

        /* Subtle vignette overlay for depth, iOS Lock Screen style */
        .background::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.35) 100%);
        }

        @media (max-width: 768px) {
            .background {
                background-image: url('bg-mobile.png');
            }
        }

        /* ---------- Header ---------- */
        header {
            position: fixed;
            top: max(16px, env(safe-area-inset-top));
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4vw;
            z-index: 10;
            color: #fff;
        }

        .header-left {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(var(--ios-blur)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--ios-blur)) saturate(180%);
            border: 0.5px solid rgba(255, 255, 255, 0.25);
            padding: 7px 16px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.2px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .header-right {
            display: flex;
            gap: 10px;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 7px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(var(--ios-blur)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--ios-blur)) saturate(180%);
            border: 0.5px solid rgba(255, 255, 255, 0.25);
            padding: 9px 18px;
            border-radius: 100px;
            cursor: pointer;
            transition: transform 0.2s var(--ios-spring), background 0.2s var(--ios-ease);
            font-weight: 600;
            font-size: 14px;
            letter-spacing: -0.2px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .tab svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .tab:active {
            transform: scale(0.94);
        }

        /* ---------- Playlist Sidebar ---------- */
        .playlist-sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: min(400px, 88vw);
            height: 100%;
            transform: translateX(100%);
            background: rgba(20, 20, 22, 0.72);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-left: 0.5px solid rgba(255, 255, 255, 0.15);
            transition: transform 0.45s var(--ios-spring);
            z-index: 20;
            display: flex;
            flex-direction: column;
            color: white;
            padding: max(28px, env(safe-area-inset-top)) 18px 24px;
        }

        .playlist-sidebar.open {
            transform: translateX(0);
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding: 0 6px 18px;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.12);
        }

        .sidebar-header h3 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.4px;
        }

        .sidebar-header button {
            background: rgba(120, 120, 128, 0.32);
            border: none;
            color: rgba(255,255,255,0.85);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s var(--ios-ease), transform 0.15s var(--ios-spring);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar-header button:hover {
            background: rgba(150, 150, 158, 0.45);
        }

        .sidebar-header button:active {
            transform: scale(0.88);
        }

        .sidebar-tracks {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 0 2px;
        }

        .sidebar-tracks::-webkit-scrollbar { width: 4px; }
        .sidebar-tracks::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }

        .track-item {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 9px 10px;
            border-radius: var(--ios-radius-sm);
            cursor: pointer;
            transition: background 0.15s var(--ios-ease);
        }

        .track-item:hover { background: rgba(255, 255, 255, 0.06); }
        .track-item:active { background: rgba(255, 255, 255, 0.1); }

        .track-item.active {
            background: rgba(48, 209, 88, 0.14);
        }

        .track-item.active .track-item-title { color: var(--ios-green); }

        .track-item.restricted {
            opacity: 0.35;
            pointer-events: none;
            filter: grayscale(100%);
        }

        .track-item img {
            width: 46px;
            height: 46px;
            border-radius: 9px;
            object-fit: cover;
            background: #222;
            flex-shrink: 0;
        }

        .track-item-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: 100%;
        }

        .track-item-title {
            font-size: 14.5px;
            font-weight: 590;
            letter-spacing: -0.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .track-item-artist {
            font-size: 12.5px;
            font-weight: 450;
            color: rgba(255, 255, 255, 0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-item-playing-icon {
            display: none;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            color: var(--ios-green);
        }

        .track-item.active .track-item-playing-icon { display: block; }

        .loading-text {
            text-align: center;
            color: rgba(255,255,255,0.4);
            margin-top: 24px;
            font-size: 14px;
            font-weight: 500;
        }

        /* Sidebar backdrop dim */
        .sidebar-scrim {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0);
            pointer-events: none;
            transition: background 0.4s var(--ios-ease);
            z-index: 19;
        }

        .sidebar-scrim.visible {
            background: rgba(0,0,0,0.25);
            pointer-events: auto;
        }

        /* ---------- Bottom Music Player (iOS "Now Playing" pill) ---------- */
        .player-container {
            position: fixed;
            bottom: max(22px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: min(94vw, 560px);
            background: rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(var(--ios-blur)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--ios-blur)) saturate(180%);
            border: 0.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 34px;
            display: flex;
            align-items: center;
            padding: 10px 10px 10px 12px;
            z-index: 10;
            color: white;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255,255,255,0.15);
        }

        .album-art {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, #30d158 0%, #1c2b1f 100%);
            margin-right: 12px;
            flex-shrink: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }

        .album-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .track-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            padding-right: 10px;
            min-width: 0;
        }

        .track-title {
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: -0.2px;
            margin-bottom: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 11.5px;
            font-weight: 450;
            color: rgba(255, 255, 255, 0.65);
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-wrapper {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 10px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            color: rgba(255, 255, 255, 0.55);
        }

        .progress-bar {
            flex-grow: 1;
            height: 14px;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
        }

        .progress-track {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 2px;
            pointer-events: none;
        }

        .progress-fill {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            height: 3px;
            width: 0%;
            background: #fff;
            border-radius: 2px;
            transition: width 0.1s linear;
        }

        .progress-thumb {
            position: absolute;
            top: 50%;
            left: 0%;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            transform: translate(-50%, -50%);
            box-shadow: 0 1px 4px rgba(0,0,0,0.4);
            opacity: 0;
            transition: opacity 0.15s var(--ios-ease);
        }

        .progress-bar:hover .progress-thumb { opacity: 1; }

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            opacity: 0.9;
            transition: opacity 0.15s var(--ios-ease), transform 0.15s var(--ios-spring);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
        }

        .ctrl-btn:hover { opacity: 1; background: rgba(255,255,255,0.08); }
        .ctrl-btn:active { transform: scale(0.85); }

        .ctrl-btn svg {
            width: 19px;
            height: 19px;
            fill: currentColor;
        }

        .play-btn {
            width: 42px;
            height: 42px;
            background: #fff;
            color: #111;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.25);
        }

        .play-btn:hover {
            background: #f2f2f2;
        }

        .play-btn svg {
            width: 17px;
            height: 17px;
            fill: #111;
        }

        #yt-player-container {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        /* Small screens: tighten the player pill */
        @media (max-width: 420px) {
            .player-container { padding: 9px 8px 9px 10px; }
            .album-art { width: 44px; height: 44px; }
            .ctrl-btn { width: 34px; height: 34px; }
            .play-btn { width: 38px; height: 38px; }
        }
    </style>
</head>
<body>

    <div class="background"></div>
    <div id="yt-player-container"></div>
    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    <!-- Playlist Sidebar -->
    <div class="playlist-sidebar" id="playlist-sidebar">
        <div class="sidebar-header">
            <h3>Playlist</h3>
            <button id="close-sidebar" aria-label="Close">✕</button>
        </div>
        <div class="sidebar-tracks" id="sidebar-tracks">
            <div class="loading-text">Loading playlist…</div>
        </div>
    </div>

    <header>
        <div class="header-left" id="live-time">--:--</div>
        <div class="header-right">
            <div class="tab" id="playlist-btn">
                <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg>
                Playlist
            </div>
        </div>
    </header>

    <div class="player-container" id="player-ui">
        <div class="album-art" id="album-art">🎵</div>

        <div class="track-info">
            <div class="track-title" id="track-title">Loading track…</div>
            <div class="track-artist" id="track-artist">YouTube Music</div>

            <div class="progress-wrapper">
                <span id="current-time">0:00</span>
                <div class="progress-bar" id="progress-bar">
                    <div class="progress-track">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <div class="progress-thumb" id="progress-thumb"></div>
                </div>
                <span id="total-time">0:00</span>
            </div>
        </div>

        <div class="controls">
            <button class="ctrl-btn" id="prev-btn" title="Previous Track">
                <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>

            <button class="ctrl-btn play-btn" id="play-pause-btn" title="Play/Pause">
                <svg id="play-pause-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>

            <button class="ctrl-btn" id="next-btn" title="Next Track">
                <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
        </div>
    </div>

    <script>
        // --- 1. Live Clock ---
        function updateTime() {
            const timeDisplay = document.getElementById('live-time');
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            timeDisplay.textContent = hours + ':' + minutes + ' ' + ampm;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // --- 2. Single Playlist Configuration ---
        const PLAYLIST_ID = 'PLW6pHGnTx70o';

        // --- 3. YouTube Iframe API Integration ---
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        let player;
        let progressInterval;
        let playlistTracksLoaded = false;

        const playBtn = document.getElementById('play-pause-btn');
        const playPauseIcon = document.getElementById('play-pause-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');
        const albumArt = document.getElementById('album-art');
        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        const progressThumb = document.getElementById('progress-thumb');
        const currentTimeDisplay = document.getElementById('current-time');
        const totalTimeDisplay = document.getElementById('total-time');

        // Sidebar UI Elements
        const playlistBtn = document.getElementById('playlist-btn');
        const playlistSidebar = document.getElementById('playlist-sidebar');
        const closeSidebarBtn = document.getElementById('close-sidebar');
        const sidebarTracks = document.getElementById('sidebar-tracks');
        const sidebarScrim = document.getElementById('sidebar-scrim');

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player-container', {
                height: '1',
                width: '1',
                playerVars: {
                    'listType': 'playlist',
                    'list': PLAYLIST_ID,
                    'controls': 0,
                    'disablekb': 1,
                    'autoplay': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerError(event) {
            console.error("YouTube Player Error Code:", event.data);

            if (player && typeof player.getPlaylistIndex === 'function') {
                const badIndex = player.getPlaylistIndex();
                const badSidebarItem = document.getElementById(`sidebar-track-${badIndex}`);

                if (badSidebarItem) {
                    badSidebarItem.classList.add('restricted');
                    const titleDiv = badSidebarItem.querySelector('.track-item-title');
                    if (titleDiv) titleDiv.textContent = '⚠️ Unavailable (Blocked by Artist)';
                }
            }

            trackTitle.textContent = "Skipping unavailable track…";

            setTimeout(() => {
                if (player && typeof player.nextVideo === 'function') {
                    const state = player.getPlayerState();
                    if (state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING) {
                        player.nextVideo();
                    } else {
                        player.nextVideo();
                        setTimeout(() => player.pauseVideo(), 200);
                    }
                }
            }, 800);
        }

        function updateMediaMetadata() {
            if (player && player.getVideoData && typeof player.getVideoData === 'function') {
                const videoData = player.getVideoData();
                if (videoData && videoData.title) {
                    trackTitle.textContent = videoData.title;
                }
                if (videoData && videoData.author) {
                    trackArtist.textContent = videoData.author;
                }
                if (videoData && videoData.video_id) {
                    albumArt.innerHTML = `<img src="https://img.youtube.com/vi/${videoData.video_id}/hqdefault.jpg" alt="Album Art">`;
                    albumArt.style.background = 'none';
                }
            }
            highlightCurrentSidebarTrack();
        }

        function onPlayerReady(event) {
            setTimeout(() => {
                player.setShuffle(true);
                setTimeout(() => {
                    updateMediaMetadata();
                }, 800);
            }, 500);

            playBtn.addEventListener('click', () => {
                const state = player.getPlayerState();
                if (state === YT.PlayerState.PLAYING) {
                    player.pauseVideo();
                } else {
                    player.playVideo();
                }
            });

            nextBtn.addEventListener('click', () => player.nextVideo());
            prevBtn.addEventListener('click', () => player.previousVideo());

            progressBar.addEventListener('click', (e) => {
                if (player && player.getDuration) {
                    const duration = player.getDuration();
                    if (duration > 0) {
                        const rect = progressBar.getBoundingClientRect();
                        const clickX = e.clientX - rect.left;
                        const percentage = clickX / rect.width;
                        const seekTime = percentage * duration;
                        player.seekTo(seekTime, true);
                        updateProgressBar();
                    }
                }
            });
        }

        // --- 4. Sidebar Functional Logic ---
        function openSidebar() {
            playlistSidebar.classList.add('open');
            sidebarScrim.classList.add('visible');
            loadPlaylistSidebar();
        }

        function closeSidebar() {
            playlistSidebar.classList.remove('open');
            sidebarScrim.classList.remove('visible');
        }

        playlistBtn.addEventListener('click', openSidebar);
        closeSidebarBtn.addEventListener('click', closeSidebar);
        sidebarScrim.addEventListener('click', closeSidebar);

        function loadPlaylistSidebar() {
            if (playlistTracksLoaded || !player || !player.getPlaylist) return;

            const trackIDs = player.getPlaylist();
            if (!trackIDs || trackIDs.length === 0) return;

            sidebarTracks.innerHTML = '';

            trackIDs.forEach((id, index) => {
                const trackEl = document.createElement('div');
                trackEl.className = 'track-item';
                trackEl.id = `sidebar-track-${index}`;

                trackEl.onclick = () => {
                    player.playVideoAt(index);
                };

                trackEl.innerHTML = `
                    <img src="https://img.youtube.com/vi/${id}/hqdefault.jpg" alt="thumbnail">
                    <div class="track-item-info">
                        <div class="track-item-title" id="sidebar-title-${index}">Fetching track…</div>
                        <div class="track-item-artist" id="sidebar-author-${index}">YouTube Music</div>
                    </div>
                    <svg class="track-item-playing-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                `;
                sidebarTracks.appendChild(trackEl);

                fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`)
                    .then(res => res.json())
                    .then(data => {
                        document.getElementById(`sidebar-title-${index}`).textContent = data.title;
                        document.getElementById(`sidebar-author-${index}`).textContent = data.author_name;
                    })
                    .catch(() => {
                        document.getElementById(`sidebar-title-${index}`).textContent = `Track ${index + 1}`;
                    });
            });

            playlistTracksLoaded = true;
            highlightCurrentSidebarTrack();
        }

        function highlightCurrentSidebarTrack() {
            if (!playlistTracksLoaded || !player || typeof player.getPlaylistIndex !== 'function') return;
            const currentIndex = player.getPlaylistIndex();

            const allTracks = document.querySelectorAll('.track-item');
            allTracks.forEach((el, index) => {
                if (index === currentIndex) {
                    el.classList.add('active');
                    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    el.classList.remove('active');
                }
            });
        }

        // --- 5. Player State Handling & Dynamic SVG Swap ---
        function onPlayerStateChange(event) {
            updateMediaMetadata();

            if (event.data === YT.PlayerState.PLAYING) {
                playPauseIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
                updateProgressBar();
                progressInterval = setInterval(updateProgressBar, 500);
            }
            else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.CUED) {
                playPauseIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
                clearInterval(progressInterval);
            }
            else if (event.data === YT.PlayerState.ENDED) {
                playPauseIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
                clearInterval(progressInterval);
            }
        }

        function updateProgressBar() {
            if (player && player.getCurrentTime) {
                const currentSeconds = player.getCurrentTime();
                const totalSeconds = player.getDuration();

                if (totalSeconds > 0) {
                    const percentage = (currentSeconds / totalSeconds) * 100;
                    progressFill.style.width = percentage + '%';
                    progressThumb.style.left = percentage + '%';

                    currentTimeDisplay.textContent = formatTime(currentSeconds);
                    totalTimeDisplay.textContent = formatTime(totalSeconds);
                }
            }
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }
    </script>
</body>
