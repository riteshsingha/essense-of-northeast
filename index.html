<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Essence of Northeast</title>
    <link rel="icon" href="icons/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/favicon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/favicon-180.png">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#121212">
    <script>
        // Runs before the stylesheet paints so the correct theme is already
        // in place on first frame: no flash of the wrong background.
        (function () {
            var stored = null;
            try { stored = localStorage.getItem('eon-theme'); } catch (e) { /* storage blocked */ }
            var prefersDark = window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = (stored === 'light' || stored === 'dark')
                ? stored
                : (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="background" aria-hidden="true">
        <div class="bg-layer bg-layer-light"></div>
        <div class="bg-layer bg-layer-dark"></div>
    </div>
    <div id="yt-player-container"></div>
    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    <!-- Playlist Sidebar -->
    <div class="playlist-sidebar" id="playlist-sidebar">
        <div class="sidebar-header">
            <h3>Playlist</h3>
            <button id="close-sidebar" aria-label="Close">✕</button>
        </div>
        <div class="sidebar-tracks" id="sidebar-tracks">
            <div class="loading-text">Loading playlist…</div>
        </div>
    </div>

    <header>
        <div class="header-left" id="live-time">--:--</div>
        <div class="header-right">
            <button class="tab theme-toggle" id="theme-toggle" type="button"
                    aria-label="Switch to dark mode" title="Switch to dark mode" aria-pressed="false">
                <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a5 5 0 100 10 5 5 0 000-10zM2 13h2a1 1 0 100-2H2a1 1 0 100 2zm18 0h2a1 1 0 100-2h-2a1 1 0 100 2zM11 2v2a1 1 0 102 0V2a1 1 0 10-2 0zm0 18v2a1 1 0 102 0v-2a1 1 0 10-2 0zM5.99 4.58a1 1 0 10-1.41 1.41l1.06 1.06a1 1 0 101.41-1.41L5.99 4.58zm12.37 12.37a1 1 0 10-1.41 1.41l1.06 1.06a1 1 0 101.41-1.41l-1.06-1.06zm1.06-10.96a1 1 0 10-1.41-1.41l-1.06 1.06a1 1 0 101.41 1.41l1.06-1.06zM7.05 18.36a1 1 0 10-1.41-1.41l-1.06 1.06a1 1 0 101.41 1.41l1.06-1.06z"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 01-4.4 2.26 5.4 5.4 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
            </button>
            <div class="tab" id="playlist-btn">
                <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg>
                Playlist
            </div>
        </div>
    </header>

    <div class="player-container" id="player-ui">
        <div class="album-art" id="album-art">🎵</div>

        <div class="track-info">
            <div class="track-title" id="track-title">Loading track…</div>
            <div class="track-artist" id="track-artist">YouTube Music</div>

            <div class="progress-wrapper">
                <span id="current-time">0:00</span>
                <div class="progress-bar disabled" id="progress-bar">
                    <div class="progress-track">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <div class="progress-thumb" id="progress-thumb"></div>
                </div>
                <span id="total-time">0:00</span>
            </div>
        </div>

        <div class="controls">
            <button class="ctrl-btn" id="repeat-btn" title="Repeat off" aria-label="Repeat off" disabled>
                <svg id="repeat-icon" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            </button>

            <button class="ctrl-btn" id="prev-btn" title="Previous Track" disabled>
                <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>

            <button class="ctrl-btn play-btn" id="play-pause-btn" title="Play/Pause" disabled>
                <svg id="play-pause-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>

            <button class="ctrl-btn" id="next-btn" title="Next Track" disabled>
                <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>

            <div class="volume-control" id="volume-control">
                <button class="ctrl-btn" id="volume-btn" title="Mute" aria-label="Mute" aria-pressed="false" disabled>
                    <svg id="volume-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
                <input type="range" class="volume-slider" id="volume-slider"
                       min="0" max="100" step="1" value="70" aria-label="Volume level">
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
